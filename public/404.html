<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page Not Found | Locully</title>
  <style>
    :root { --terra:#CC6432; --ink:#1A1108; --muted:#6b6157; --bg:#F8F6F3; --bdr:#E2DDD6; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { height:100%; }
    body {
      background:var(--bg); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .wrap { text-align:center; max-width:560px; }
    .code { font-size:13px; letter-spacing:.2em; text-transform:uppercase; color:var(--terra); font-weight:700; margin-bottom:16px; }
    h1 { font-size:clamp(28px,6vw,44px); line-height:1.12; margin-bottom:16px; }
    p { color:var(--muted); font-size:16px; line-height:1.6; margin-bottom:28px; }
    .links { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
    a { text-decoration:none; font-size:14px; font-weight:600; padding:11px 20px; border-radius:999px; }
    a.primary { background:var(--terra); color:#fff; }
    a.ghost { border:1px solid var(--bdr); color:var(--ink); }
    a.ghost:hover { border-color:var(--terra); color:var(--terra); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">Error 404</div>
    <h1>This page doesn&rsquo;t exist</h1>
    <p>The page you&rsquo;re looking for may have moved or never existed. Here are some good places to go instead.</p>
    <div class="links">
      <a class="primary" href="/">Back to home</a>
      <a class="ghost" href="/ai-optimization/">AI Optimization for Clinics</a>
      <a class="ghost" href="/blog/">Read the blog</a>
    </div>
  </div>
</body>
</html>
